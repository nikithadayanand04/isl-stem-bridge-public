<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photosynthesis in ISL</title>
  <link rel="stylesheet" href="player.css?v=16">
  <link rel="stylesheet" href="scenes.css?v=6">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="review-banner" class="review-banner" hidden>
    Interpreter review mode · the original ISLRTC video is shown below · project team only
  </div>

  <header class="topbar">
    <h1 id="lesson-title">Photosynthesis: how plants make their own food</h1>
    <span id="draft-note" class="draft-badge" hidden
          title="The avatar copies real ISLRTC Indian Sign Language recordings. An ISL interpreter has not yet checked the avatar's signing.">Draft</span>
  </header>

  <nav id="section-nav" class="chapters" aria-label="Chapters"></nav>

  <main class="lesson-page">
    <div class="stage-row">
      <div class="stage">
        <canvas id="avatar" aria-label="ISL signing avatar"></canvas>
        <div id="no-model" class="overlay" hidden>
          <strong>No avatar model loaded.</strong>
          Add a realistic, rigged model at <code>avatar/avatar.glb</code>.
        </div>
      </div>

      <div class="picture">
        <div id="concept" class="concept" hidden>
          <span id="concept-term" class="concept-term"></span>
          <span id="concept-kn" class="concept-kn" lang="kn"></span>
          <button id="concept-sign" type="button" class="concept-sign">✋ Sign</button>
          <small id="concept-why" class="concept-why"></small>
        </div>
        <svg id="diagram" class="diagram" viewBox="0 0 600 360" role="img" aria-labelledby="lesson-caption"></svg>
      </div>
    </div>

    <div class="controls-bar">
      <div class="transport">
        <button id="lesson-prev" type="button" aria-label="Previous step">◀</button>
        <button id="lesson-play" type="button" class="play">▶ Play</button>
        <button id="lesson-next" type="button" aria-label="Next step">▶</button>
        <button id="replay" type="button" class="secondary" disabled>↻ Sign again</button>
      </div>
      <div class="options">
        <label class="opt">Speed
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
          </select>
        </label>
        <label class="opt"><input id="captions" type="checkbox" checked> Captions</label>
        <label class="opt"><input id="closeup" type="checkbox"> Hands close-up</label>
        <details class="more">
          <summary>More</summary>
          <label class="opt" title="Spoken voice, for hearing teachers. Off by default.">Voice (hearing teachers)
            <select id="narration"><option value="">Off</option></select>
          </label>
        </details>
      </div>
    </div>

    <section class="lesson" aria-label="Lesson">
      <div class="step-head">
        <p id="lesson-part" class="lesson-part"></p>
        <div id="steps" class="steps" aria-label="Steps in this chapter" hidden></div>
      </div>
      <p id="lesson-caption" class="lesson-caption" aria-live="polite"></p>
      <p id="lesson-caption-kn" class="lesson-caption-kn" lang="kn" hidden></p>
      <ul id="recap-points" class="recap-points" hidden></ul>
      <p id="isl-status" class="isl-status" hidden></p>
      <div id="key-terms" class="key-terms" hidden>
        <p id="key-terms-label" class="key-terms-label"></p>
        <div id="key-terms-list" class="key-terms-list"></div>
      </div>
    </section>

    <div class="team-notes">
      <p id="lesson-note" class="lesson-note"></p>
      <p id="narration-note" class="lesson-note" hidden></p>
    </div>

    <figure id="reference" class="reference" hidden>
      <video id="ref-video" controls playsinline muted></video>
      <figcaption>Original ISLRTC video (review mode only): <span id="ref-credit"></span></figcaption>
    </figure>
  </main>

  <script type="module" src="player.js?v=22"></script>
</body>
</html>
