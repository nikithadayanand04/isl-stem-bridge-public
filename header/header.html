<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;width:1600px;height:400px;overflow:hidden}</style>
</head><body>
<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="0.5" stop-color="#EAE2FF"/>
      <stop offset="1" stop-color="#FFE6F1"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- soft blobs -->
  <circle cx="120" cy="330" r="150" fill="#D5F5E3" opacity=".8"/>
  <circle cx="1500" cy="60" r="140" fill="#FFF3C4" opacity=".9"/>
  <circle cx="820" cy="430" r="260" fill="#FFFFFF" opacity=".55"/>
  <circle cx="1180" cy="360" r="120" fill="#FFD9E8" opacity=".7"/>

  <!-- confetti shapes & maths symbols -->
  <g font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="44" opacity=".75">
    <text x="420" y="80" fill="#9B8AE6">+</text>
    <text x="560" y="150" fill="#F49AC1">×</text>
    <text x="1080" y="90" fill="#7CC8A3">÷</text>
    <text x="1300" y="210" fill="#F7B955">=</text>
    <text x="300" y="235" fill="#7FB2F0">π</text>
  </g>
  <polygon points="1010,170 1030,135 1050,170" fill="#F7B955" opacity=".8"/>
  <rect x="480" y="250" width="26" height="26" rx="5" fill="#7CC8A3" opacity=".8" transform="rotate(20 493 263)"/>
  <circle cx="1400" cy="300" r="12" fill="#9B8AE6" opacity=".7"/>
  <circle cx="250" cy="60" r="9" fill="#F49AC1"/>
  <!-- stars -->
  <g fill="#FFC94D">
    <path d="M60 70 l8 18 20 2 -15 13 5 20 -18 -11 -18 11 5 -20 -15 -13 20 -2z"/>
    <path d="M700 50 l5 11 12 1 -9 8 3 12 -11 -7 -11 7 3 -12 -9 -8 12 -1z"/>
    <path d="M1250 40 l6 13 14 1 -11 9 4 14 -13 -8 -13 8 4 -14 -11 -9 14 -1z"/>
  </g>

  <!-- planet with ring -->
  <g transform="translate(180 150)">
    <circle r="62" fill="#B9A7F5"/>
    <path d="M-45 -20 q30 -12 75 6" stroke="#A08DEB" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-50 18 q40 14 95 -6" stroke="#A08DEB" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse rx="105" ry="22" fill="none" stroke="#F7B955" stroke-width="9" transform="rotate(-18)"/>
  </g>
  <circle cx="320" cy="110" r="20" fill="#7FB2F0"/>

  <!-- microscope -->
  <g transform="translate(360 210)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="150" width="120" height="22" rx="10" fill="#6C7BD9"/>
    <path d="M30 150 q-10 -50 30 -80" stroke="#6C7BD9" stroke-width="16" fill="none"/>
    <rect x="35" y="-10" width="30" height="90" rx="10" fill="#8C9CF0" transform="rotate(-25 50 35)"/>
    <rect x="15" y="-30" width="30" height="22" rx="6" fill="#6C7BD9" transform="rotate(-25 30 -19)"/>
    <rect x="50" y="110" width="60" height="10" rx="5" fill="#A9B6F7"/>
  </g>

  <!-- children learning together -->
  <g transform="translate(600 0)">
    <!-- kid 1 -->
    <g transform="translate(70 0)">
      <rect x="-48" y="268" width="96" height="150" rx="40" fill="#F49AC1"/>
      <circle cy="215" r="40" fill="#8D5524"/>
      <path d="M-42 210 q0 -55 42 -55 q42 0 42 55 q-10 -30 -42 -32 q-32 2 -42 32z" fill="#2B1B12"/>
      <circle cx="-14" cy="218" r="4" fill="#2B1B12"/><circle cx="14" cy="218" r="4" fill="#2B1B12"/>
      <path d="M-12 234 q12 10 24 0" stroke="#2B1B12" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M40 300 q40 -30 46 -88" stroke="#F49AC1" stroke-width="22" fill="none" stroke-linecap="round"/>
      <circle cx="86" cy="204" r="15" fill="#8D5524"/>
    </g>
    <!-- kid 2 (headscarf) -->
    <g transform="translate(210 0)">
      <rect x="-50" y="262" width="100" height="160" rx="40" fill="#7CC8A3"/>
      <path d="M-48 225 q0 -70 48 -70 q48 0 48 70 l6 50 h-108z" fill="#9B8AE6"/>
      <circle cy="212" r="34" fill="#C68642"/>
      <circle cx="-12" cy="214" r="4" fill="#2B1B12"/><circle cx="12" cy="214" r="4" fill="#2B1B12"/>
      <path d="M-10 228 q10 9 20 0" stroke="#2B1B12" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- kid 3 -->
    <g transform="translate(350 0)">
      <rect x="-46" y="272" width="92" height="150" rx="38" fill="#7FB2F0"/>
      <circle cy="222" r="38" fill="#F1C27D"/>
      <path d="M-40 212 q4 -50 40 -50 q38 0 42 46 q-20 -18 -50 -14 q-16 2 -32 18z" fill="#E0A030"/>
      <circle cx="-13" cy="226" r="4" fill="#2B1B12"/><circle cx="13" cy="226" r="4" fill="#2B1B12"/>
      <path d="M-11 240 q11 10 22 0" stroke="#2B1B12" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="-26" cy="236" r="6" fill="#F49AC1" opacity=".5"/><circle cx="26" cy="236" r="6" fill="#F49AC1" opacity=".5"/>
    </g>
    <!-- shared open book in front -->
    <g transform="translate(210 330)">
      <path d="M-150 0 q75 -30 150 0 v70 q-75 -30 -150 0z" fill="#FFFFFF" stroke="#9B8AE6" stroke-width="5"/>
      <path d="M150 0 q-75 -30 -150 0 v70 q75 -30 150 0z" fill="#FFFDF2" stroke="#9B8AE6" stroke-width="5"/>
      <path d="M-120 18 q50 -16 100 0 M-120 38 q50 -16 100 0" stroke="#C9C0F2" stroke-width="5" fill="none"/>
      <circle cx="70" cy="22" r="14" fill="#7CC8A3"/>
      <path d="M40 50 l20 -16 16 10 24 -22" stroke="#F49AC1" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- laptop with atom -->
  <g transform="translate(1060 220)">
    <rect x="0" y="0" width="170" height="110" rx="12" fill="#6C7BD9"/>
    <rect x="10" y="10" width="150" height="90" rx="6" fill="#E9F3FF"/>
    <g transform="translate(85 55)" fill="none" stroke="#9B8AE6" stroke-width="4">
      <ellipse rx="38" ry="14"/>
      <ellipse rx="38" ry="14" transform="rotate(60)"/>
      <ellipse rx="38" ry="14" transform="rotate(-60)"/>
      <circle r="6" fill="#F49AC1" stroke="none"/>
    </g>
    <path d="M-20 110 h210 l-14 22 h-182z" fill="#8C9CF0"/>
  </g>

  <!-- stack of books -->
  <g transform="translate(1300 270)">
    <rect x="0" y="80" width="130" height="30" rx="6" fill="#F49AC1"/>
    <rect x="12" y="50" width="110" height="30" rx="6" fill="#7CC8A3"/>
    <rect x="-4" y="20" width="120" height="30" rx="6" fill="#F7B955"/>
    <rect x="10" y="94" width="100" height="5" fill="#fff" opacity=".7"/>
    <rect x="22" y="64" width="80" height="5" fill="#fff" opacity=".7"/>
    <rect x="6" y="34" width="90" height="5" fill="#fff" opacity=".7"/>
  </g>

  <!-- potted plant -->
  <g transform="translate(1480 250)">
    <path d="M-35 70 h70 l-10 70 h-50z" fill="#F7B955"/>
    <path d="M0 70 q-5 -60 0 -110" stroke="#4FA97E" stroke-width="7" fill="none"/>
    <ellipse cx="-28" cy="10" rx="28" ry="13" fill="#7CC8A3" transform="rotate(-30 -28 10)"/>
    <ellipse cx="28" cy="-10" rx="28" ry="13" fill="#7CC8A3" transform="rotate(30 28 -10)"/>
    <ellipse cx="-20" cy="-35" rx="24" ry="11" fill="#4FA97E" transform="rotate(-40 -20 -35)"/>
    <ellipse cx="18" cy="40" rx="22" ry="10" fill="#4FA97E" transform="rotate(20 18 40)"/>
  </g>
</svg>
</body></html>
